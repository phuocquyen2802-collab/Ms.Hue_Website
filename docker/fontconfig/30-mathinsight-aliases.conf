<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Phông thay thế cho ảnh công thức MathType khi máy chủ không có phông gốc.

  Công thức trong đề Word dùng nhiều "Palatino Linotype" (phông Windows có bản
  quyền). Thiếu phông này, LibreOffice lấy phông mặc định (DejaVu Serif, rộng
  hơn hẳn) nên các chữ trong ảnh công thức bị chồng lên nhau. P052 (gói
  fonts-urw-base35) là bản Palatino tự do, cùng độ rộng chữ.

  "accept" chỉ dùng phông thay thế khi KHÔNG có phông gốc: chép pala*.ttf vào
  docker/fonts/ thì máy chủ dùng đúng Palatino Linotype.
-->
<fontconfig>
  <alias binding="same">
    <family>Palatino Linotype</family>
    <accept>
      <family>P052</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Palatino</family>
    <accept>
      <family>P052</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Book Antiqua</family>
    <accept>
      <family>P052</family>
    </accept>
  </alias>
</fontconfig>
