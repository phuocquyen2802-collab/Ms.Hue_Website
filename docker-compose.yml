name: mathinsight

services:
  app:
    build: .
    image: mathinsight-ai:latest
    container_name: mathinsight-ai
    restart: unless-stopped
    # JWT_SECRET, GEMINI_API_KEY... đọc từ backend/.env (tạo từ backend/.env.example)
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Mặc định mở cổng 80 của server (truy cập http://<IP-server>).
      # Cổng 80 đã có dịch vụ khác dùng thì chạy: APP_PORT=8080 docker compose up -d
      - "${APP_PORT:-80}:5000"
    volumes:
      # Toàn bộ dữ liệu (tài khoản, đề thi, bài nộp, file tải lên) nằm ở đây,
      # giữ nguyên khi build lại hay khởi động lại container.
      - app-data:/app/data

volumes:
  app-data:
    name: mathinsight-data
